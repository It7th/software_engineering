services:
  mongo:
    image: mongo:7.0
    container_name: lms-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./validation.js:/docker-entrypoint-initdb.d/01-validation.js:ro
      - ./data.js:/docker-entrypoint-initdb.d/02-data.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  lms-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms-mongo-api
    environment:
      PORT: 8080
      MONGO_URL: mongodb://mongo:27017/lms_mongo
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
